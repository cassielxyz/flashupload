name: Capture README Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-preview.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture live FlashUpload homepage
        run: |
          mkdir -p docs/previews
          npx --yes playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size "1440,1000" \
            --full-page \
            --wait-for-timeout 4000 \
            https://flashupload.cassielae.me/ \
            docs/previews/landing.png

      - name: Commit preview when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews/landing.png
          if git diff --cached --quiet; then
            echo "Preview is unchanged."
          else
            git commit -m "docs: refresh live README preview"
            git push
          fi
