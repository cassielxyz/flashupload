<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FlashUpload logo</title>
  <desc id="desc">A multicolor rounded-square upload and lightning mark.</desc>
  <defs>
