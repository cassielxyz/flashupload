    <linearGradient id="blue" x1="70" y1="45" x2="330" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#35c7f4"/><stop offset=".38" stop-color="#0f7df1"/><stop offset="1" stop-color="#1437e6"/></linearGradient>
    <linearGradient id="green" x1="260" y1="40" x2="475" y2="275" gradientUnits="userSpaceOnUse"><stop stop-color="#54f58a"/><stop offset="1" stop-color="#00a95f"/></linearGradient>
